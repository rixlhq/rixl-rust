name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Keep rustup state inside the mise data dir so the mise-action cache
  # restores the full Rust toolchain (not just mise's install marker).
  MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
  MISE_CARGO_HOME: /home/runner/.local/share/mise/cargo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install tools with mise
        uses: jdx/mise-action@v5

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      # sdk/ is generated by gen.sh, so only the examples are held to fmt and clippy.
      - name: Check formatting
        run: cargo fmt -p rixl-examples -- --check

      - name: Clippy
        run: cargo clippy -p rixl-examples --all-targets --locked --no-deps -- -D warnings

      - name: Build with native-tls
        run: cargo build --workspace --all-targets --locked

      - name: Build with rustls
        run: cargo build -p rixl --no-default-features --features rustls,bon --locked

      - name: Run tests
        run: cargo test --workspace --locked
