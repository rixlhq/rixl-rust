[package]
name = "rixl"
version = "1.0.1"
authors = ["Max Sosnovsky <maksim@rixl.com>"]
description = "Official Rust SDK for the Rixl API platform"
license = "MIT"
edition = "2021"
readme = "README.md"
repository = "https://github.com/rixlhq/rixl-rust"
homepage = "https://rixl.com"
documentation = "https://docs.rs/rixl"
keywords = ["rixl", "sdk", "api"]
categories = ["api-bindings", "web-programming"]

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
chrono = { version = "^0.4",  features = ["serde"] }
async-trait = "^0.1"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "stream", "query", "form"] }
bon = { version = "2.3", optional = true }
[features]
default = ["native-tls", "bon"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
bon = ["dep:bon"]
