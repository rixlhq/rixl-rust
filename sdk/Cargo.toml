[package]
name = "rixl"
version = "0.1.0"
authors = ["OpenAPI Generator team and contributors"]
description = "Customer-facing API for the Rixl platform, served by the edge gateway. The gateway is a grpc-gateway based HTTP/JSON layer that proxies requests to Rixl's backend gRPC services (api and auth-api), exposing a single unified REST surface generated directly from the service protos. It validates credentials at the edge — bearer tokens (Authorization) and API keys (X-API-Key) — forwards them to the backend services, and returns consistent JSON error responses."
# Override this license by providing a License Object in the OpenAPI.
license = "Unlicense"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
chrono = { version = "^0.4",  features = ["serde"] }
async-trait = "^0.1"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "stream", "query", "form"] }
bon = { version = "2.3", optional = true }
[features]
default = ["native-tls", "bon"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
bon = ["dep:bon"]
