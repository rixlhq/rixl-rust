[package]
name = "rixl"
version = "1.1.0"
authors = ["Max Sosnovsky <maksim@rixl.com>"]
description = "Customer-facing REST API for the Rixl platform. Provides video and image upload, processing, delivery, and analytics with edge validation of API keys (X-API-Key) and bearer tokens (Authorization)."
license = "MIT"
edition = "2021"
readme = "README.md"
keywords = ["rixl", "sdk", "api"]
categories = ["api-bindings", "web-programming"]
repository = "https://github.com/rixlhq/rixl-rust"
documentation = "https://docs.rs/rixl"
homepage = "https://rixl.com"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
chrono = { version = "^0.4",  features = ["serde"] }
async-trait = "^0.1"
reqwest = { version = "^0.13", default-features = false, features = ["rustls", "json", "multipart", "stream", "query", "form"] }
bon = "2.3"
