[package]
name = "rixl-examples"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rixl = { path = "../sdk" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde_json = "1"
